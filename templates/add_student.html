<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <h1>Add Student</h1>

    <form method="POST">

        <label for="roll">Roll Number</label>
        <input
            type="text"
            id="roll"
            name="roll"
            placeholder="Enter Roll Number"
            required>

        <label for="name">Student Name</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter Student Name"
            required>

        <label for="english">English Marks</label>
        <input
            type="number"
            id="english"
            name="english"
            placeholder="Enter English Marks"
            min="0"
            max="100"
            required>

        <label for="maths">Maths Marks</label>
        <input
            type="number"
            id="maths"
            name="maths"
            placeholder="Enter Maths Marks"
            min="0"
            max="100"
            required>

        <label for="science">Science Marks</label>
        <input
            type="number"
            id="science"
            name="science"
            placeholder="Enter Science Marks"
            min="0"
            max="100"
            required>

        <button type="submit">
            Save Student
        </button>

    </form>

    <div class="menu">
        <a href="/">🏠 Home</a>
        <a href="/report">📄 Search Result</a>
    </div>

</div>

</body>

</html>
